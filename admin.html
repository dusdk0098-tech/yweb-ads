<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y웹 광고 관리</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#d9dde3; --text:#1c1e21; --muted:#667085; --primary:#1a56db; --danger:#c62828; --warn:#b45309; --ok:#1b7f3a; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
  main { max-width:1080px; margin:0 auto; display:grid; gap:16px; }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:15px; margin:0 0 10px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .muted { color:var(--muted); font-size:12px; }
  label { display:grid; gap:3px; font-size:12px; color:var(--muted); }
  input, textarea, button { font:inherit; }
  input[type=text], input[type=url], input[type=date], input[type=password], textarea { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; color:var(--text); background:#fff; }
  textarea { min-height:140px; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  button { padding:7px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  button.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:600; white-space:nowrap; }
  td.actions { white-space:nowrap; }
  td.actions button { padding:3px 8px; margin-right:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
  .status { padding:8px 10px; border-radius:6px; font-size:13px; }
  .status.err { background:#fdecea; color:var(--danger); }
  .status.ok { background:#e8f5ec; color:var(--ok); }
  .status.warn { background:#fff4e5; color:var(--warn); }
  .status ul { margin:4px 0 0 18px; padding:0; }
  .badge { display:inline-block; white-space:nowrap; padding:1px 7px; border-radius:10px; font-size:11px; background:#eef0f3; color:var(--muted); }
  .badge.on { background:#e8f5ec; color:var(--ok); }
  .badge.off { background:#fff4e5; color:var(--warn); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
  .ad { display:flex; gap:10px; border:1px solid var(--line); border-radius:8px; padding:10px; background:#fff; text-decoration:none; color:inherit; }
  .ad.off { opacity:.55; }
  .ad img { width:64px; height:64px; object-fit:cover; border-radius:6px; background:#eef0f3; flex:none; }
  .ad b { display:block; font-size:14px; }
  .ad span { display:block; font-size:12px; color:var(--muted); word-break:break-all; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <header class="row" style="justify-content:space-between">
    <div>
      <h1>Y웹 광고 관리</h1>
      <div class="muted">피드: <code>dusdk0098-tech/yweb-ads</code> · <code>ads.json</code> · 규칙은 YWeb <code>docs/ADS.md</code>와 같음</div>
    </div>
    <div class="row">
      <button id="reload">다시 불러오기</button>
      <span id="loadInfo" class="muted"></span>
    </div>
  </header>

  <div id="msg" class="status hidden"></div>

  <section>
    <h2>광고 목록 <span id="count" class="badge"></span></h2>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>#</th><th>상태</th><th>id</th><th>제목</th><th>문구</th><th>링크</th><th>이미지</th><th>기간</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2 id="formTitle">광고 추가</h2>
    <form id="form" novalidate>
      <div class="grid">
        <label>id (소문자·숫자·하이픈, 40자, 고유)<input name="id" type="text" maxlength="40" required pattern="[a-z0-9-]{1,40}" placeholder="safety-shop"></label>
        <label>제목 (1~60자)<input name="title" type="text" maxlength="60" required></label>
        <label>링크 (https://, 300자)<input name="url" type="url" maxlength="300" required placeholder="https://"></label>
        <label>이미지 파일명 (선택, 이름.png/.jpg)
          <div class="row" style="flex-wrap:nowrap">
            <input name="image" type="text" placeholder="shop.png" style="flex:1">
            <input id="imgFile" type="file" accept="image/png,image/jpeg" class="hidden">
            <button type="button" id="imgUpload" title="PNG/JPG 300KB 이하, 토큰 필요">올리기</button>
          </div>
        </label>
        <label>시작일 (선택)<input name="from" type="date"></label>
        <label>종료일 (선택)<input name="to" type="date"></label>
      </div>
      <label style="margin-top:10px">문구 (0~140자)<input name="text" type="text" maxlength="140"></label>
      <div id="formErr" class="status err hidden" style="margin-top:10px"></div>
      <div class="row" style="margin-top:10px">
        <button type="submit" class="primary" id="formSubmit">추가</button>
        <button type="button" id="formCancel" class="hidden">취소</button>
      </div>
    </form>
  </section>

  <section>
    <h2>미리보기 <span class="muted">(Y웹 홈 광고 칸, 오늘 기준)</span></h2>
    <div id="preview" class="cards"></div>
  </section>

  <section>
    <h2>GitHub에 저장</h2>
    <div class="row">
      <label style="flex:1;min-width:260px">Fine-grained 토큰 (yweb-ads 저장소, Contents: Read and write)
        <input id="token" type="password" autocomplete="off" placeholder="github_pat_…">
      </label>
      <label class="row" style="flex-direction:row;align-items:center"><input id="remember" type="checkbox"> 이 브라우저에 기억</label>
      <button id="tokenSave">토큰 저장</button>
      <button id="tokenClear">토큰 지우기</button>
      <span id="tokenInfo" class="muted"></span>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="commit" class="primary">main에 커밋</button>
      <span class="muted">저장 전에 전체 피드를 다시 검사합니다. 토큰은 api.github.com에만 보냅니다. Pages 반영까지 1~2분.</span>
    </div>
  </section>

  <section>
    <h2>백업 경로 <span class="muted">(토큰 없이: 복사해서 GitHub 웹에서 ads.json에 붙여 넣기)</span></h2>
    <div class="row" style="margin-bottom:8px">
      <button id="copy">JSON 복사</button>
      <button id="download">다운로드</button>
      <span id="size" class="muted"></span>
    </div>
    <textarea id="json" readonly></textarea>
  </section>
</main>

<script>
"use strict";
// Same rules as YWeb server/ads.ts (zod adsFeed, strict) — keep in sync with docs/ADS.md.
const OWNER = "dusdk0098-tech", REPO = "yweb-ads", BRANCH = "main";
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const MAX_ADS = 20, MAX_FEED_BYTES = 64 * 1024, MAX_IMAGE_BYTES = 300 * 1024;
const RX = { id: /^[a-z0-9-]{1,40}$/, image: /^[a-z0-9-]+\.(png|jpg|jpeg)$/, date: /^\d{4}-\d{2}-\d{2}$/ };
const TOKEN_KEY = "yweb-ads-token";
const $ = (id) => document.getElementById(id);

let feed = { version: 1, ads: [] };
let editIndex = -1;

function validateAd(a, i, seen) {
  const p = `${i + 1}번(${a.id || "id 없음"}): `, e = [];
  if (!RX.id.test(a.id || "")) e.push(p + "id는 소문자·숫자·하이픈 1~40자");
  else if (seen.has(a.id)) e.push(p + "id 중복"); else seen.add(a.id);
  const title = (a.title || "").trim();
  if (title.length < 1 || title.length > 60) e.push(p + "제목은 1~60자");
  if ((a.text || "").trim().length > 140) e.push(p + "문구는 140자 이하");
  const url = a.url || "";
  let ok = false; try { new URL(url); ok = true; } catch {}
  if (!ok || !url.startsWith("https://") || url.length > 300) e.push(p + "링크는 https://로 시작하는 올바른 주소, 300자 이하");
  if (a.image !== undefined && !RX.image.test(a.image)) e.push(p + "이미지는 이름.png/.jpg (소문자·숫자·하이픈)");
  if (a.from !== undefined && !RX.date.test(a.from)) e.push(p + "시작일은 YYYY-MM-DD");
  if (a.to !== undefined && !RX.date.test(a.to)) e.push(p + "종료일은 YYYY-MM-DD");
  if (a.from && a.to && a.from > a.to) e.push(p + "시작일이 종료일보다 늦음");
  const extra = Object.keys(a).filter((k) => !["id", "title", "text", "url", "image", "from", "to"].includes(k));
  if (extra.length) e.push(p + "알 수 없는 필드 " + extra.join(", "));
  return e;
}
function validateFeed(f) {
  const e = [];
  if (!f || f.version !== 1) e.push("version은 1이어야 함");
  if (!Array.isArray(f?.ads)) return e.concat("ads는 배열이어야 함");
  if (f.ads.length > MAX_ADS) e.push(`광고는 ${MAX_ADS}개까지`);
  const seen = new Set();
  f.ads.forEach((a, i) => e.push(...validateAd(a, i, seen)));
  const bytes = feedBytes(f).length;
  if (bytes > MAX_FEED_BYTES) e.push(`파일이 64KB를 넘음 (${bytes} B)`);
  return e;
}
const feedText = (f) => JSON.stringify(f, null, 2) + "\n";
const feedBytes = (f) => new TextEncoder().encode(feedText(f));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const isLive = (a) => (!a.from || a.from <= today()) && (!a.to || today() <= a.to);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function showMsg(kind, text, list) {
  const m = $("msg"); m.className = "status " + kind;
  m.innerHTML = esc(text) + (list?.length ? "<ul>" + list.map((x) => `<li>${esc(x)}</li>`).join("") + "</ul>" : "");
  m.scrollIntoView({ block: "nearest" });
}
const hideMsg = () => { $("msg").className = "status hidden"; };

function render() {
  const errs = validateFeed(feed);
  $("count").textContent = `${feed.ads.length}/${MAX_ADS}`;
  $("rows").innerHTML = feed.ads.map((a, i) => `<tr>
    <td>${i + 1}</td>
    <td><span class="badge ${isLive(a) ? "on" : "off"}">${isLive(a) ? "게재중" : "기간 외"}</span></td>
    <td><code>${esc(a.id)}</code></td><td>${esc(a.title)}</td><td>${esc(a.text)}</td>
    <td><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url.replace(/^https:\/\//, "").slice(0, 40))}</a></td>
    <td>${esc(a.image || "")}</td><td>${esc(a.from || "")}${a.from || a.to ? " ~ " : "항상"}${esc(a.to || "")}</td>
    <td class="actions"><button data-edit="${i}">수정</button><button data-del="${i}" class="danger">삭제</button></td>
  </tr>`).join("") || `<tr><td colspan="9" class="muted">광고가 없습니다.</td></tr>`;
  $("preview").innerHTML = feed.ads.map((a) => `<a class="ad ${isLive(a) ? "" : "off"}" href="${esc(a.url)}" target="_blank" rel="noopener">
    ${a.image ? `<img src="${esc(a.image)}" alt="">` : ""}
    <div><b>${esc(a.title)}</b><span>${esc(a.text)}</span>${isLive(a) ? "" : `<span class="badge off">기간 외</span>`}</div>
  </a>`).join("") || `<span class="muted">표시할 광고가 없습니다.</span>`;
  $("json").value = feedText(feed);
  $("size").textContent = `${feedBytes(feed).length} B / ${MAX_FEED_BYTES} B`;
  $("commit").disabled = errs.length > 0;
  if (errs.length) showMsg("err", "현재 피드에 규칙 위반이 있어 저장할 수 없습니다.", errs);
}

// ---- load ----
async function load() {
  try {
    const r = await fetch(`ads.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const errs = validateFeed(data);
    feed = data; editIndex = -1; resetForm();
    $("loadInfo").textContent = `불러옴 ${new Date().toLocaleTimeString()}`;
    if (!errs.length) hideMsg();
    render();
  } catch (e) {
    feed = { version: 1, ads: [] }; render();
    showMsg("err", `ads.json을 불러오지 못했습니다: ${e.message}. 빈 피드로 시작합니다.`);
  }
}

// ---- form ----
const F = $("form");
function resetForm() {
  F.reset(); editIndex = -1;
  $("formTitle").textContent = "광고 추가"; $("formSubmit").textContent = "추가";
  $("formCancel").classList.add("hidden"); $("formErr").classList.add("hidden");
  F.id.disabled = false;
}
function fillForm(a) {
  for (const k of ["id", "title", "text", "url", "image", "from", "to"]) F[k].value = a[k] ?? "";
}
function readForm() {
  const v = (k) => F[k].value.trim();
  const a = { id: v("id"), title: v("title"), text: v("text"), url: v("url") };
  if (v("image")) a.image = v("image");
  if (v("from")) a.from = v("from");
  if (v("to")) a.to = v("to");
  return a;
}
F.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const a = readForm();
  const seen = new Set(feed.ads.filter((_, i) => i !== editIndex).map((x) => x.id));
  const errs = validateAd(a, editIndex < 0 ? feed.ads.length : editIndex, seen);
  if (editIndex < 0 && feed.ads.length >= MAX_ADS) errs.push(`광고는 ${MAX_ADS}개까지`);
  const next = feed.ads.slice(); if (editIndex < 0) next.push(a); else next[editIndex] = a;
  if (feedBytes({ version: 1, ads: next }).length > MAX_FEED_BYTES) errs.push("파일이 64KB를 넘음");
  if (errs.length) { $("formErr").innerHTML = "<ul>" + errs.map((x) => `<li>${esc(x)}</li>`).join("") + "</ul>"; $("formErr").classList.remove("hidden"); return; }
  feed.ads = next; resetForm(); hideMsg(); render();
});
$("formCancel").onclick = resetForm;
$("rows").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.edit !== undefined) {
    editIndex = +b.dataset.edit; fillForm(feed.ads[editIndex]);
    $("formTitle").textContent = `광고 수정 (${feed.ads[editIndex].id})`; $("formSubmit").textContent = "수정 저장";
    $("formCancel").classList.remove("hidden"); F.scrollIntoView({ block: "start" });
  } else if (b.dataset.del !== undefined) {
    const a = feed.ads[+b.dataset.del];
    if (confirm(`"${a.title}" (${a.id}) 광고를 지울까요? 커밋 전까지는 다시 불러오기로 되돌릴 수 있습니다.`)) { feed.ads.splice(+b.dataset.del, 1); resetForm(); render(); }
  }
});

// ---- token (browser only; sent to api.github.com only) ----
const getToken = () => sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY) || "";
function tokenInfo() {
  const t = getToken();
  $("tokenInfo").textContent = t ? `토큰 저장됨 (${localStorage.getItem(TOKEN_KEY) ? "이 브라우저" : "이 탭"}, 끝 …${t.slice(-4)})` : "토큰 없음";
}
$("tokenSave").onclick = () => {
  const t = $("token").value.trim(); if (!t) return showMsg("warn", "토큰을 입력하세요.");
  sessionStorage.removeItem(TOKEN_KEY); localStorage.removeItem(TOKEN_KEY);
  ($("remember").checked ? localStorage : sessionStorage).setItem(TOKEN_KEY, t);
  $("token").value = ""; tokenInfo(); hideMsg();
};
$("tokenClear").onclick = () => { sessionStorage.removeItem(TOKEN_KEY); localStorage.removeItem(TOKEN_KEY); tokenInfo(); };

async function gh(path, init = {}) {
  const t = getToken(); if (!t) throw new Error("토큰이 없습니다. 먼저 토큰을 저장하세요.");
  const r = await fetch(API + path, { ...init, headers: { authorization: `Bearer ${t}`, accept: "application/vnd.github+json", "x-github-api-version": "2022-11-28", ...(init.headers || {}) } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(`GitHub ${r.status}: ${body.message || "오류"}`);
  return body;
}
async function currentSha(path) {
  try { return (await gh(`${path}?ref=${BRANCH}`)).sha; }
  catch (e) { if (/GitHub 404/.test(e.message)) return undefined; throw e; }
}
const b64 = (bytes) => btoa(Array.from(bytes, (c) => String.fromCharCode(c)).join(""));
async function putFile(path, bytes, message) {
  const sha = await currentSha(path); // always the latest sha, so a stale page cannot overwrite silently
  return gh(path, { method: "PUT", body: JSON.stringify({ message, content: b64(bytes), branch: BRANCH, ...(sha ? { sha } : {}) }) });
}

// ---- commit ----
$("commit").onclick = async () => {
  const errs = validateFeed(feed);
  if (errs.length) return showMsg("err", "규칙 위반이 있어 저장하지 않았습니다.", errs);
  const b = $("commit"); b.disabled = true;
  try {
    const res = await putFile("ads.json", feedBytes(feed), `광고 ${feed.ads.length}개 (admin.html)`);
    showMsg("ok", `커밋 완료: ${res.commit?.sha?.slice(0, 7) || ""} · Pages 반영까지 1~2분 걸립니다.`);
  } catch (e) { showMsg("err", `저장 실패: ${e.message}`); }
  b.disabled = false;
};

// ---- image upload ----
$("imgUpload").onclick = () => $("imgFile").click();
$("imgFile").onchange = async () => {
  const f = $("imgFile").files[0]; $("imgFile").value = ""; if (!f) return;
  const name = (F.image.value.trim() || f.name).toLowerCase().replace(/[^a-z0-9.-]/g, "-");
  if (!RX.image.test(name)) return showMsg("err", `파일명 "${name}"이 규칙(소문자·숫자·하이픈 + .png/.jpg)에 맞지 않습니다. 이미지 파일명 칸에 먼저 적으세요.`);
  if (!["image/png", "image/jpeg"].includes(f.type)) return showMsg("err", "PNG 또는 JPG만 올릴 수 있습니다.");
  if (f.size > MAX_IMAGE_BYTES) return showMsg("err", `이미지는 300KB 이하여야 합니다 (${f.size} B).`);
  try {
    await putFile(name, new Uint8Array(await f.arrayBuffer()), `이미지 ${name} (admin.html)`);
    F.image.value = name; showMsg("ok", `이미지 ${name} 올림. 광고를 추가/수정 저장한 뒤 main에 커밋하세요.`);
  } catch (e) { showMsg("err", `이미지 업로드 실패: ${e.message}`); }
};

// ---- backup ----
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("json").value); showMsg("ok", "JSON을 복사했습니다. GitHub 웹에서 ads.json을 열어 붙여 넣으세요."); }
  catch { $("json").select(); showMsg("warn", "자동 복사가 막혔습니다. 아래 내용을 직접 복사하세요."); }
};
$("download").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([$("json").value], { type: "application/json" })); a.download = "ads.json"; a.click();
  URL.revokeObjectURL(a.href);
};
$("reload").onclick = load;

// self-check of the validator against the server rules (prints to console only)
(() => {
  const ok = { id: "a-1", title: "t", text: "", url: "https://x.y" };
  console.assert(validateFeed({ version: 1, ads: [ok] }).length === 0, "valid feed rejected");
  console.assert(validateFeed({ version: 2, ads: [] }).length === 1, "version 2 accepted");
  console.assert(validateAd({ ...ok, url: "http://x.y" }, 0, new Set()).length === 1, "http accepted");
  console.assert(validateAd({ ...ok, image: "A.png" }, 0, new Set()).length === 1, "bad image accepted");
  console.assert(validateAd({ ...ok, extra: 1 }, 0, new Set()).length === 1, "extra key accepted");
  console.assert(validateFeed({ version: 1, ads: [ok, { ...ok }] }).length === 1, "duplicate id accepted");
  console.assert(validateFeed({ version: 1, ads: Array.from({ length: 21 }, (_, i) => ({ ...ok, id: "a" + i })) }).length === 1, "21 ads accepted");
})();

tokenInfo();
load();
</script>
</body>
</html>
